# Production (EC2): pulls the image built by GitHub Actions.
# Copied to ~/pms-backend/docker-compose.yml on the server by the deploy workflow.
services:
  api:
    image: ghcr.io/jeevanantham-poongodi/pms-backend:latest
    container_name: pms-backend
    env_file: .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
